<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product Review Form | WDD 131</title>
        <meta
            name="description"
            content="Share your thoughts with us! Use our simple product review form to rate your recent purchase and see how many reviews you've completed so far."
        />
        <meta name="auther" content="Adafa Ralph" />
        <link rel="stylesheet" href="styles/form.css" />
        <script src="scripts/form.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Product Review</h1>
        </header>

        <main>
            <form method="get" action="review.html" class="review-form">
                <fieldset>
                    <legend>Product Information</legend>

                    <label for="productName"
                        >Product Name <span class="required">*</span></label
                    >
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>
                            Select a Product ...
                        </option>
                    </select>

                    <div class="rating-group">
                        <p>Overall Rating <span class="required">*</span></p>
                        <div class="stars">
                            <input
                                type="radio"
                                id="star1"
                                name="rating"
                                value="1"
                                required
                            />
                            <label for="star1">1</label>

                            <input
                                type="radio"
                                id="star2"
                                name="rating"
                                value="2"
                                required
                            />
                            <label for="star2">2</label>

                            <input
                                type="radio"
                                id="star3"
                                name="rating"
                                value="3"
                                required
                            />
                            <label for="star3">3</label>

                            <input
                                type="radio"
                                id="star4"
                                name="rating"
                                value="4"
                                required
                            />
                            <label for="star4">4</label>

                            <input
                                type="radio"
                                id="star5"
                                name="rating"
                                value="5"
                                required
                            />
                            <label for="star5">5</label>
                        </div>
                    </div>

                    <label for="installDate"
                        >Date of Installation
                        <span class="required">*</span></label
                    >
                    <input
                        type="date"
                        id="installDate"
                        name="installDate"
                        required
                    />
                </fieldset>

                <fieldset>
                    <legend>Your Feedback</legend>
                    <p>
                        Which features did you find useful? (Check all that
                        apply)
                    </p>
                    <div class="checkbox-group">
                        <div class="check-item">
                            <input
                                type="checkbox"
                                id="durability"
                                name="features"
                                value="durability"
                            />
                            <label for="durability">Durability</label>
                        </div>
                        <div class="check-item">
                            <input
                                type="checkbox"
                                id="ease-of-use"
                                name="features"
                                value="ease-of-use"
                            />
                            <label for="ease-of-use">Ease of Use</label>
                        </div>
                        <div class="check-item">
                            <input
                                type="checkbox"
                                id="performance"
                                name="features"
                                value="performance"
                            />
                            <label for="performance">Performance</label>
                        </div>
                        <div class="check-item">
                            <input
                                type="checkbox"
                                id="design"
                                name="features"
                                value="design"
                            />
                            <label for="design">Design</label>
                        </div>
                    </div>

                    <label for="writtenReview">Written Review</label>
                    <textarea
                        id="writtenReview"
                        name="writtenReview"
                        rows="4"
                    ></textarea>

                    <label for="userName">User Name (Optional)</label>
                    <input type="text" id="userName" name="userName" />
                </fieldset>

                <input type="submit" value="Post Review" />
            </form>
        </main>

        <footer>
            <p>
                &copy; <span id="year"></span> | Product Review Assignment |
                Adafa Ralph
            </p>
            <p>Last Modified: <span id="lastModified"></span></p>
        </footer>
    </body>
</html>
