<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Review Confirmation | WDD 131</title>
        <link rel="stylesheet" href="styles/form.css" />
        <script src="scripts/form.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Thank You!</h1>
        </header>

        <main class="confirmation-container">
            <div class="card">
                <h2>Review Submitted Successfully</h2>
                <p>Your feedback helps us improve our products.</p>
                <div class="counter-display">
                    <p>
                        Total reviews you have submitted:
                        <span id="reviewCount">0</span>
                    </p>
                </div>
                <a href="form.html" class="button">Submit Another Review</a>
            </div>
        </main>

        <footer>
            <p>
                &copy; <span id="year"></span> | Product Review Assignment |
                Your Name
            </p>
            <p>Last Modified: <span id="lastModified"></span></p>
        </footer>
    </body>
</html>
